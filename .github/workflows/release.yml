name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; no token is stored.
      - run: npm install -g npm@11
      - name: npm publish
        # Skips a version that is already on npm, such as 0.1.0, which was published by hand.
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Already on npm; skipping publish."
          else
            npm publish
          fi
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ github.token }}
